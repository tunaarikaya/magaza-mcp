version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "npm"
    labels:
      - bagimlilik
      - otomasyon
    groups:
      gelistirme-bagimliliklari:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "actions"
    labels:
      - bagimlilik
      - otomasyon
