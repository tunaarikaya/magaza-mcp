# npm yayını — token yok, kaynağı kanıtlanabilir (provenance) sürüm.
#
# Yayın "trusted publishing" ile yapılıyor: npm tarafında bu depo ve bu
# workflow dosyası güvenilir yayıncı olarak tanımlı. GitHub her çalışmada
# kısa ömürlü, imzalı bir OIDC kimliği üretiyor, npm onu doğrulayıp yayına
# izin veriyor. Depoda saklanan bir yayın token'ı yok — çalınacak, süresi
# dolacak, yanlışlıkla sızacak bir sır da yok.
#
# Aynı mekanizma provenance belgesini de üretir: npm sayfasındaki
# "Provenance" bölümü, tarball'ın bu depodaki bu commit'ten, bu workflow
# tarafından üretildiğini kanıtlar.
#
# npm tarafındaki ayar: Packages → magaza-mcp → Settings → Trusted Publisher
#   Provider: GitHub Actions
#   Organization or user: tunaarikaya
#   Repository: magaza-mcp
#   Workflow filename: yayinla.yml
#
# Çalıştırmak için: sürüm etiketi it (npm version minor && git push --follow-tags)
# veya Actions sekmesinden elle tetikle.

name: Yayınla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiket:
        description: "Yayınlanacak sürüm etiketi (örn. v0.2.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  yayinla:
    name: npm'e yayınla
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # OIDC kimliği bu izin olmadan üretilemez; trusted publishing'in şartı.
      id-token: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.etiket || github.ref }}

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing npm 11.5.1 ile geldi; Node 22 daha eski bir npm ile
      # kuruluyor. Eskisiyle yayın "ENEEDAUTH" diye düşer, sebebi de görünmez.
      - name: npm'i güncelle
        run: |
          npm install -g npm@latest
          npm --version

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Sürüm etiketle uyuşuyor mu?
        # Yanlış sürümün yayınlanması geri alınamaz; etiket ile package.json
        # ayrışmışsa burada duruyoruz.
        run: |
          etiket="${{ github.event.inputs.etiket || github.ref_name }}"
          surum="v$(node -p "require('./package.json').version")"
          if [ "$etiket" != "$surum" ]; then
            echo "::error::Etiket ($etiket) ile package.json sürümü ($surum) uyuşmuyor."
            exit 1
          fi
          echo "Sürüm doğrulandı: $surum"

      - name: Tip kontrolü
        run: npm run kontrol

      - name: Derle
        run: npm run build

      - name: Testler
        run: node --test dist/test/*.test.js

      - name: Yayınla
        # Token yok: npm, OIDC ortamını kendisi tanıyıp kimliği oradan alır.
        # ENEEDAUTH alıyorsan npm tarafındaki Trusted Publisher kaydı eksik ya
        # da bu dosyanın adıyla (yayinla.yml) uyuşmuyordur.
        run: npm publish --provenance --access public
