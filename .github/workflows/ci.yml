name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derleme:
    name: Derleme ve tip kontrolü (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node ${{ matrix.node }} kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Tip kontrolü
        run: npm run kontrol

      - name: Derle
        run: npm run build
